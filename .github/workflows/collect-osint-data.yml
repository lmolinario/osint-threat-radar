name: Collect OSINT data

on:
  schedule:
    # GitHub cron runs in UTC. The job is intentionally offset from minute 0
    # to reduce scheduling delays during high-load periods.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osint-data-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect OSINT data
        run: |
          python scripts/collect_osint_data.py

      - name: Commit updated snapshots
        run: |
          git config user.name "osint-threat-radar-bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update OSINT data snapshots"
            git push
          fi
